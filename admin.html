<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PAOTY S2 · Organiser Dashboard</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .gate-card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line-soft); border-radius: 18px; padding: 30px 26px; text-align: center; box-shadow: var(--shadow); }
  .gate-card img { width: 200px; margin: 0 auto 18px; }
  .gate-card h1 { font: 900 40px/.95 var(--sans); text-transform: uppercase; margin: 0 0 10px; }
  .gate-card p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .field { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 12px 14px; outline: 0; margin-bottom: 12px; text-align: center; font: 700 14px var(--mono); letter-spacing: .1em; }
  .field:focus { border-color: var(--gold); }
  .err { color: #ff8d93; font-size: 13.5px; min-height: 20px; margin-top: 8px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 14px 16px; }
  .stat .k { font: 700 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .stat .v { font: 900 32px/1.15 var(--sans); text-transform: uppercase; margin-top: 6px; }
  .stat .s { font: 11px var(--mono); letter-spacing: .06em; color: var(--muted); }
  .stat .v.ok { color: var(--green); } .stat .v.warn { color: var(--gold); }
  .panel { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); margin-bottom: 22px; overflow: hidden; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
  .panel-head h2 { margin: 0; font: 800 26px/1 var(--sans); text-transform: uppercase; }
  .panel-head .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font: 700 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; background: var(--bg-2); }
  th[data-sort] { cursor: pointer; } th[data-sort]:hover { color: var(--text); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tr.row { cursor: pointer; } tr.row:hover td { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: 0; }
  .t-rank { font: 800 24px var(--sans); color: var(--accent); width: 44px; text-align: center; }
  
  .t-img img { width: 52px; height: 52px; border-radius: 9px; object-fit: cover; background: #0a0d18; }
  .t-id { font: 700 12.5px var(--mono); color: var(--accent); letter-spacing: .1em; white-space: nowrap; }
  .t-mark { font: 900 22px var(--sans); white-space: nowrap; }
  .t-name { font-weight: 600; white-space: nowrap; }
  .t-sub { color: var(--muted); font: 12px var(--mono); white-space: nowrap; }
  .t-title { max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .muted { color: var(--faint); }
  .two { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, .65fr); gap: 22px; align-items: start; }
  .hist-list { max-height: 720px; overflow: auto; padding: 6px 14px 14px; }
  .h-item { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
  .h-item:last-child { border-bottom: 0; }
  .h-item .tm { color: var(--accent); font: 700 11.5px var(--mono); }
  .h-item b.id { font: 700 12px var(--mono); color: var(--accent); letter-spacing: .08em; }
  .h-item .dv { color: var(--muted); font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .chip-juror { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--gold-soft); color: var(--gold); margin-left: 4px; }
  .modal { position: fixed; inset: 0; z-index: 60; background: rgba(5, 7, 14, .78); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal.open { display: flex; }
  .m-card { width: min(1040px, 100%); max-height: 92vh; overflow: auto; background: var(--bg-2); border: 1px solid var(--line); border-radius: 18px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .m-art { background: #070912; display: grid; place-items: center; min-height: 360px; position: relative; }
  .m-art img { max-width: 100%; max-height: 80vh; object-fit: contain; cursor: zoom-in; }
  .m-info { padding: 22px; position: relative; }
  .m-info .icon-btn { position: absolute; top: 14px; right: 14px; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 14px; margin: 14px 0; }
  .kv dt { color: var(--muted); font: 700 11px/1.9 var(--mono); letter-spacing: .14em; text-transform: uppercase; } .kv dd { margin: 0; word-break: break-word; }
  .m-mark { display: inline-flex; gap: 10px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; margin-top: 4px; }
  .m-mark b { font: 900 34px var(--sans); }
  .upd { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 8px; }
  .brand { display: flex; align-items: center; gap: 14px; text-decoration: none; min-width: 0; }
  .brand-text { font: 700 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .brand-text b { display: block; font: 800 16px var(--sans); letter-spacing: 0; color: var(--fg); }
  #jurors { padding: 0; }
  #jurors .tab { min-width: 0; padding: 8px 14px; font-size: 14px; border-radius: 999px; }
  .panel { border-radius: 14px; }
  .gate-card { border-radius: 14px; }
  .modal .d-desc { background: var(--white); color: var(--white-ink); border-radius: 12px; padding: 14px 16px; }
  @media (max-width: 1000px) { .two { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 760px) { #jurors { display: flex !important; } .brand-text { display: none; } .m-card { grid-template-columns: 1fr; } .m-art { min-height: 260px; } .topbar .upd .lbl { display: none; } .stat .v { font-size: 23px; } }
</style>
</head>
<body>

<section class="gate" id="gate">
  <form class="gate-card" id="gate-form">
    <img src="logo.png" alt="PAOTY Season 2">
    <h1>Organiser Dashboard</h1>
    <p>Enter the organiser key to see jury results and participant details.</p>
    <input class="field" id="key" type="password" placeholder="Organiser key" autocomplete="current-password" required>
    <label style="display:flex;gap:8px;justify-content:center;font-size:13px;color:var(--muted);margin-bottom:16px"><input type="checkbox" id="remember" checked> Remember on this device</label>
    <button class="btn" type="submit">Open dashboard</button>
    <div class="err" id="gate-err"></div>
  </form>
</section>

<div id="dash" class="hidden">
  <header class="topbar">
    <a class="brand" href="admin.html"><img src="logo.png" alt="PAOTY Season 2"><div class="brand-text"><b>Organiser Dashboard</b>Season 2 · Jury results</div></a>
    <div class="spacer"></div>
    <nav class="tabs" id="jurors"></nav>
    <div class="spacer"></div>
    <div class="upd"><span class="lbl" id="upd">—</span><button class="btn ghost small" id="refresh">↻ Refresh</button></div>
    <button class="btn ghost small" id="logout" title="Forget key on this device">Lock</button>
  </header>

  <main class="wrap">
    <div class="stats" id="stats"></div>

    <section class="panel">
      <div class="panel-head">
        <h2 id="top-title">Live Top 10</h2>
        <div class="tools"><span class="t-sub" id="final-info"></span><button class="btn ghost small" id="csv-top">⬇ Top 10 CSV</button><button class="btn ghost small" id="reset-juror" title="Erase this juror's marks and history everywhere">Reset juror</button></div>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Rank</th><th></th><th>Entry</th><th>Marks</th><th>Artist</th><th>Age</th><th>State</th><th>Phone</th><th>Email</th><th>Artwork</th></tr></thead>
        <tbody id="top-body"></tbody>
      </table></div>
    </section>

    <div class="two">
      <section class="panel">
        <div class="panel-head">
          <h2>All Entries &amp; Marks</h2>
          <div class="tools">
            <label class="search" style="min-width:200px"><span aria-hidden="true">⌕</span><input id="aq" type="search" placeholder="Search name, entry, title, state"></label>
            <button class="btn ghost small" id="csv-all">⬇ All marks CSV</button>
          </div>
        </div>
        <div class="tbl-wrap"><table>
          <thead><tr><th data-sort="rank">Rank</th><th></th><th data-sort="id">Entry</th><th data-sort="mark">Marks ↓</th><th data-sort="name">Artist</th><th data-sort="state">State</th><th>Artwork</th><th data-sort="t">Last changed</th></tr></thead>
          <tbody id="all-body"></tbody>
        </table></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Change History</h2><span class="t-sub" id="hist-count"></span></div>
        <div class="hist-list" id="hist"></div>
      </section>
    </div>
  </main>
</div>

<div class="modal" id="modal"><div class="m-card" id="m-card"></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="shared.js"></script>
<script src="admin.js"></script>
</body>
</html>
